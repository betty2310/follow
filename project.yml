name: ProjectRecord
options:
  bundleIdPrefix: dev.betty
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: NO
    MARKETING_VERSION: "0.1.0"    # overridden by the release tag in CI (v1.2.0 -> 1.2.0)
    CURRENT_PROJECT_VERSION: "1"
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.0.0
  CoreXLSX:
    url: https://github.com/CoreOffice/CoreXLSX
    from: 0.14.2
targets:
  ProjectRecord:
    type: application
    platform: macOS
    sources: [ProjectRecord]
    dependencies:
      - package: CoreXLSX
      - package: GRDB
    info:
      path: ProjectRecord/Resources/Info.plist
      properties:
        CFBundleDisplayName: ProjectRecord
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.education
        NSMicrophoneUsageDescription: ProjectRecord records your weekly sessions with students.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.betty.ProjectRecord
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon  # ProjectRecord/Resources/Assets.xcassets/AppIcon.appiconset
  ProjectRecordTests:
    type: bundle.unit-test
    platform: macOS
    sources: [ProjectRecordTests]
    dependencies:
      - target: ProjectRecord
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/ProjectRecord.app/Contents/MacOS/ProjectRecord
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  ProjectRecord:
    build:
      targets:
        ProjectRecord: all
        ProjectRecordTests: [test]
    test:
      targets: [ProjectRecordTests]
