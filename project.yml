name: Follow
options:
  bundleIdPrefix: dev.betty
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: NO
    MARKETING_VERSION: "0.1.0"    # overridden by the release tag in CI (v1.2.0 -> 1.2.0)
    CURRENT_PROJECT_VERSION: "1"
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.0.0
  CoreXLSX:
    url: https://github.com/CoreOffice/CoreXLSX
    from: 0.14.2
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.0
targets:
  Follow:
    type: application
    platform: macOS
    sources: [Follow]
    dependencies:
      - package: CoreXLSX
      - package: GRDB
      - package: Sparkle
    info:
      path: Follow/Resources/Info.plist
      properties:
        CFBundleDisplayName: Follow
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.education
        NSMicrophoneUsageDescription: Follow records your weekly sessions with students.
        # In-app updates (D28): appcast.xml is attached to every GitHub Release by .github/workflows/release.yml.
        SUFeedURL: https://github.com/betty2310/follow/releases/latest/download/appcast.xml
        SUPublicEDKey: "zbMFwPh/tnBSTnbdAc+ECxZkrijE8i1zwfwoMb1Sq98="  # private half: GitHub secret SPARKLE_PRIVATE_KEY
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400   # daily; AppUpdater also checks at every launch
        NSDocumentsFolderUsageDescription: Follow keeps its database and recordings in Documents/Follow.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.betty.Follow
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon  # Follow/Resources/Assets.xcassets/AppIcon.appiconset
  FollowTests:
    type: bundle.unit-test
    platform: macOS
    sources: [FollowTests]
    dependencies:
      - target: Follow
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Follow.app/Contents/MacOS/Follow
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  Follow:
    build:
      targets:
        Follow: all
        FollowTests: [test]
    test:
      targets: [FollowTests]
