name: Setup
description: Select Xcode 26, install XcodeGen, restore the Swift package cache.
runs:
  using: composite
  steps:
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26'
    - name: Install XcodeGen
      shell: bash
      run: brew install xcodegen
    # SwiftPM records absolute paths (e.g. binary artifacts like Sparkle.xcframework), so a cache is only
    # valid at the workspace path it was built in: the key includes it (the repo rename moved it).
    - name: Cache Swift packages
      uses: actions/cache@v4
      with:
        path: build/SourcePackages
        key: spm-${{ runner.os }}-${{ github.workspace }}-${{ hashFiles('project.yml') }}
        restore-keys: spm-${{ runner.os }}-${{ github.workspace }}-
