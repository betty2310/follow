name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: make test
      - run: make release BUILD=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: ProjectRecord-${{ github.sha }}
          path: build/ProjectRecord.zip
          retention-days: 14
