name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: make test
      - run: make release SIGN_ID=-  # no certificate on main builds; only tagged releases are installed
      - uses: actions/upload-artifact@v4
        with:
          name: Follow-${{ github.sha }}
          path: build/Follow.zip
          retention-days: 14
