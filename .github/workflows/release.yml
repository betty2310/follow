name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # tags + history for the update's release notes
      - uses: ./.github/actions/setup
      - run: make test
      - name: Build release
        run: make release VERSION="${GITHUB_REF_NAME#v}"
      # Sparkle feed for in-app updates (D28): signed with the EdDSA key whose public half is SUPublicEDKey
      # in project.yml. The app reads it from releases/latest/download/appcast.xml.
      - name: Generate appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::error::Missing secret SPARKLE_PRIVATE_KEY (see docs/DECISIONS.md D28)"; exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p build/appcast
          cp "build/ProjectRecord-$VERSION.zip" build/appcast/
          # Release notes shown in the update window: commit subjects since the previous tag.
          PREV=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          git log --no-merges --max-count=30 --pretty='- %s' ${PREV:+"$PREV.."}"$GITHUB_REF_NAME" \
            > "build/appcast/ProjectRecord-$VERSION.md"
          echo "$SPARKLE_PRIVATE_KEY" | build/SourcePackages/artifacts/sparkle/Sparkle/bin/generate_appcast \
            --ed-key-file - --embed-release-notes \
            --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/" \
            --link "https://github.com/$GITHUB_REPOSITORY/releases" \
            build/appcast
          cat build/appcast/appcast.xml
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cat > notes.md <<'NOTES'
          ## Install
          1. Download `ProjectRecord-*.zip`, unzip it, and move **ProjectRecord.app** to `/Applications`.
          2. The app is ad-hoc signed (not notarized), so macOS blocks it on first launch. Run once:
             ```bash
             xattr -dr com.apple.quarantine /Applications/ProjectRecord.app
             ```
          Requires macOS 26+ on Apple Silicon and the `claude` CLI logged in.

          Already installed? The app checks for updates at launch and daily: click the version bubble at the bottom of the sidebar (or **ProjectRecord → Check for Updates…**).
          NOTES
          gh release create "$GITHUB_REF_NAME" "build/ProjectRecord-$VERSION.zip" build/appcast/appcast.xml \
            --title "ProjectRecord $VERSION" --notes-file notes.md --generate-notes --verify-tag
